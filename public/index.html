<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title> Congratulations!!! Simple Node.js Web App</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h1 { margin-bottom: 0.25rem; }
      form { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
      input[type="text"] { flex: 1; padding: 0.5rem; font-size: 1rem; }
      button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
      ul { list-style: none; padding: 0; }
      li { padding: 0.6rem 0.75rem; border: 1px solid #8884; border-radius: 6px; margin-bottom: 0.5rem; }
      time { display: block; font-size: 0.8rem; opacity: 0.6; }
    </style>
  </head>
  <body>
    <h1>Simple Node.js Web App</h1>
    <p>Add a message — it is stored in memory on the server.</p>

    <form id="message-form">
      <input type="text" id="message-input" placeholder="Type a message…" autocomplete="off" required />
      <button type="submit">Add</button>
    </form>

    <ul id="messages"></ul>

    <script>
      const form = document.getElementById("message-form");
      const input = document.getElementById("message-input");
      const list = document.getElementById("messages");

      async function loadMessages() {
        const res = await fetch("/api/messages");
        const data = await res.json();
        list.innerHTML = "";
        for (const m of data.slice().reverse()) {
          const li = document.createElement("li");
          li.textContent = m.text;
          const t = document.createElement("time");
          t.textContent = new Date(m.createdAt).toLocaleString();
          li.appendChild(t);
          list.appendChild(li);
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        await fetch("/api/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        input.value = "";
        loadMessages();
      });

      loadMessages();
    </script>
  </body>
</html>
